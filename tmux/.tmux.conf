# ============================================================
# General
# ============================================================

# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0 (easier keyboard access)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 10000

# Reduce escape time (important for vim/neovim)
set -sg escape-time 10

# Enable focus events (helps vim/neovim detect focus)
set -g focus-events on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# ============================================================
# Keybindings
# ============================================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# Copy mode (vim-style + clipboard integration)
# ============================================================

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"   # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"  # Linux

# ============================================================
# Status Bar
# ============================================================

set -g status-position top
set -g status-interval 5
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]  "

# Right: user, host, time
set -g status-right-length 60
set -g status-right "#[fg=#45475a]  %H:%M  #[fg=#6c7086]%d %b "

# Window tabs
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e]  #I:#W  "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa] #[fg=#1e1e2e,bg=#89b4fa,bold]#I:#W #[fg=#89b4fa,bg=#1e1e2e]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa

# ============================================================
# Plugins (via TPM)
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Better clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'   # restore neovim sessions too

# Auto-save sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Open URLs with Prefix + u (fuzzy picker, like VSCode link detection)
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'x'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
